# Non-secret project settings (run from expense-tracker module directory).
# Authentication: use Jenkins withSonarQubeEnv, or pass -Dsonar.token=... (never commit tokens).

sonar.projectKey=expense-tracker
sonar.projectName=Expense Tracker

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# JaCoCo XML report (produced by mvn test / verify)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
